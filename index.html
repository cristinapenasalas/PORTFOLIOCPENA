<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#faf8f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#201f1d" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Cristina Peña — Especialista en comunicación digital y desarrollo web. Redes sociales, email marketing, webs e IA aplicada al marketing."
    />
    <title>Cristina Peña — Comunicación digital &amp; desarrollo web</title>

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Cristina Peña" />
    <meta property="og:title" content="Cristina Peña — Comunicación digital & desarrollo web" />
    <meta
      property="og:description"
      content="Especialista en comunicación digital y desarrollo web. Redes sociales, email marketing, webs e IA aplicada al marketing."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Cristina Peña — Comunicación digital & desarrollo web" />
    <meta
      name="twitter:description"
      content="Especialista en comunicación digital y desarrollo web. Redes sociales, email marketing, webs e IA aplicada al marketing."
    />
    <meta name="twitter:image" content="/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('cp-theme');
          var theme =
            stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
